name: Terraform - Demo Data

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Terraform operation
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-demo-data
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: ${{ inputs.operation == 'destroy' && 'demo-data-destroy' || 'demo-data' }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_demo_allowed_cidr: ${{ vars.DEMO_ALLOWED_CIDR }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.2"

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_DATA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check required repository variables
        shell: bash
        run: |
          test -n "$TF_STATE_BUCKET" || { echo "Missing TF_STATE_BUCKET repository variable"; exit 1; }
          test -n "$TF_VAR_demo_allowed_cidr" || { echo "Missing DEMO_ALLOWED_CIDR repository variable"; exit 1; }

      - name: Initialize remote state
        shell: bash
        run: |
          terraform -chdir=terraform/demo init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=therapist-dashboard/demo-data.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Format check
        run: terraform -chdir=terraform/demo fmt -check

      - name: Validate
        run: terraform -chdir=terraform/demo validate

      - name: Plan
        if: inputs.operation == 'plan'
        run: terraform -chdir=terraform/demo plan -lock-timeout=5m

      - name: Apply reviewed plan
        if: inputs.operation == 'apply'
        shell: bash
        run: |
          terraform -chdir=terraform/demo plan -lock-timeout=5m -out=apply.tfplan
          terraform -chdir=terraform/demo apply -auto-approve apply.tfplan

      - name: Destroy data stack
        if: inputs.operation == 'destroy'
        shell: bash
        run: |
          echo "The database has deletion_protection and prevent_destroy enabled."
          echo "This operation will fail until both safeguards are removed in a reviewed code change."
          terraform -chdir=terraform/demo plan -destroy -lock-timeout=5m -out=destroy.tfplan
          terraform -chdir=terraform/demo apply -auto-approve destroy.tfplan
