name: Terraform - Demo Hosted App

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Terraform operation
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-demo-app
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: demo-app
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      DUCKDNS_SUBDOMAIN: ${{ vars.DUCKDNS_SUBDOMAIN }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.2"

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_APP_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check required repository configuration
        shell: bash
        env:
          DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
        run: |
          test -n "$TF_STATE_BUCKET" || { echo "Missing TF_STATE_BUCKET repository variable"; exit 1; }
          test -n "$DUCKDNS_SUBDOMAIN" || { echo "Missing DUCKDNS_SUBDOMAIN repository variable"; exit 1; }
          if [[ "$DUCKDNS_SUBDOMAIN" == *.* ]]; then
            echo "DUCKDNS_SUBDOMAIN must contain only the label, without .duckdns.org"
            exit 1
          fi
          if [[ "${{ inputs.operation }}" == "apply" ]]; then
            test -n "$DUCKDNS_TOKEN" || { echo "Missing DUCKDNS_TOKEN environment secret"; exit 1; }
          fi

      - name: Read persistent demo outputs
        shell: bash
        run: |
          terraform -chdir=terraform/demo init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=therapist-dashboard/demo-data.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform -chdir=terraform/demo output -json > "$RUNNER_TEMP/demo-outputs.json"
          if aws iam get-role --role-name therapist-dashboard-demo-app-instance >/dev/null 2>&1; then
            aws iam list-attached-role-policies \
              --role-name therapist-dashboard-demo-app-instance \
              --query 'AttachedPolicies[].PolicyArn' \
              --output json > "$RUNNER_TEMP/attached-application-policies.json"
          else
            echo '[]' > "$RUNNER_TEMP/attached-application-policies.json"
          fi
          jq '[
            .[]
            | select(test("^arn:aws:iam::[0-9]{12}:policy/td-[a-z0-9-]+-storage-[0-9a-f-]{36}$"))
          ]' "$RUNNER_TEMP/attached-application-policies.json" > "$RUNNER_TEMP/organization-storage-policies.json"
          jq \
            --arg domain "$DUCKDNS_SUBDOMAIN.duckdns.org" \
            --arg region "$AWS_REGION" \
            --slurpfile organization_storage_policy_arns "$RUNNER_TEMP/organization-storage-policies.json" '
            {
              aws_region: $region,
              domain_name: $domain,
              vpc_id: .demo_vpc_id.value,
              public_subnet_ids: .demo_public_subnet_ids.value,
              database_client_security_group_id: .database_client_security_group_id.value,
              database_endpoint: .database_endpoint.value,
              database_name: .database_name.value,
              database_secret_arn: .database_master_user_secret_arn.value,
              database_kms_key_arn: .database_kms_key_arn.value,
              hosted_app_runtime_secret_arn: .hosted_app_runtime_secret_arn.value,
              clinical_synthesis_secret_arn: .clinical_synthesis_secret_arn.value,
              healthscribe_input_bucket: .healthscribe_input_bucket.value,
              healthscribe_output_bucket: .healthscribe_output_bucket.value,
              healthscribe_batch_data_access_role_arn: .healthscribe_batch_data_access_role_arn.value,
              healthscribe_caller_policy_arn: .healthscribe_caller_policy_arn.value,
              organization_storage_policy_arns: $organization_storage_policy_arns[0]
            }
          ' "$RUNNER_TEMP/demo-outputs.json" > terraform/demo-app/terraform.auto.tfvars.json

      - name: Initialize hosted-app state
        shell: bash
        run: |
          terraform -chdir=terraform/demo-app init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=therapist-dashboard/demo-app.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Format check
        run: terraform -chdir=terraform/demo-app fmt -check

      - name: Validate
        run: terraform -chdir=terraform/demo-app validate

      - name: Plan
        if: inputs.operation == 'plan'
        run: terraform -chdir=terraform/demo-app plan -lock-timeout=5m

      - name: Apply hosted application infrastructure
        if: inputs.operation == 'apply'
        shell: bash
        run: |
          terraform -chdir=terraform/demo-app plan -lock-timeout=5m -out=apply.tfplan
          terraform -chdir=terraform/demo-app apply -auto-approve apply.tfplan

      - name: Update DuckDNS
        if: inputs.operation == 'apply'
        shell: bash
        env:
          DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
        run: |
          app_ip="$(terraform -chdir=terraform/demo-app output -raw public_ip)"
          response="$(curl --fail --silent --show-error \
            --get 'https://www.duckdns.org/update' \
            --data-urlencode "domains=$DUCKDNS_SUBDOMAIN" \
            --data-urlencode "token=$DUCKDNS_TOKEN" \
            --data-urlencode "ip=$app_ip")"
          test "$response" = "OK" || { echo "DuckDNS rejected the update"; exit 1; }
          echo "DuckDNS now points to the hosted demo Elastic IP."

      - name: Destroy hosted application infrastructure
        if: inputs.operation == 'destroy'
        shell: bash
        run: |
          terraform -chdir=terraform/demo-app plan -destroy -lock-timeout=5m -out=destroy.tfplan
          terraform -chdir=terraform/demo-app apply -auto-approve destroy.tfplan
